name: "Dọn dẹp & Xóa toàn bộ build cũ"

on:
  workflow_dispatch:
    inputs:
      delete_all:
        description: 'Xác nhận xóa sạch toàn bộ lịch sử build cũ (Xanh & Đỏ)'
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Xóa toàn bộ lịch sử workflow runs cũ
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0

      - name: 2. Quét dọn bổ sung bằng GitHub CLI (đảm bảo sạch 100%)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Kiểm tra và xóa các run còn sót lại..."
          gh run list --repo ${{ github.repository }} --limit 100 --json databaseId --jq '.[].databaseId' | while read id; do
            if [ "$id" != "$GITHUB_RUN_ID" ] && [ -n "$id" ]; then
              echo "Đang xóa run ID: $id"
              gh run delete "$id" --repo ${{ github.repository }} || true
            fi
          done
          echo "Đã dọn dẹp sạch sẽ toàn bộ build cũ thành công!"
