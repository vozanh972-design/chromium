name: Build Windows Browser EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Kéo mã nguồn dự án
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Tự động gom tài nguyên giao diện & Cấu hình App
        run: |
          mkdir app_runtime
          mkdir app_runtime\public
          mkdir app_runtime\public\images

          # Đóng gói giao diện HTML tối ưu sạch và các hình nền hệ điều hành
          Copy-Item -Path "chrome\browser\resources\new_tab_page\new_tab_page.html" -Destination "app_runtime\public\index.html" -Force
          Copy-Item -Path "chrome\browser\resources\new_tab_page\images\*" -Destination "app_runtime\public\images" -Force

          @"
          {
            "name": "lumen-browser",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": { "dist": "electron-builder --win --x64" },
            "build": {
              "appId": "com.lumen.browser",
              "productName": "Lumen Browser",
              "directories": { "output": "dist" },
              "win": { "target": "nsis" },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "perMachine": false,
                "runAfterFinish": true
              }
            },
            "devDependencies": {
              "electron": "^30.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          "@ | Out-File -FilePath app_runtime\package.json -Encoding utf8

          @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          const fs = require('fs');

          // =========================================================================
          // CẤU HÌNH CHROMIUM ANTIDETECT (TRIỆT TIÊU 100% TELEMETRY & CHỐNG PHÁT HIỆN)
          // =========================================================================
          // 1. Chống phát hiện Bot / Automation (Xóa navigator.webdriver)
          app.commandLine.appendSwitch('disable-blink-features', 'AutomationControlled');
          
          // 2. Chống rò rỉ IP card mạng thật qua WebRTC (WebRTC Leak Shield)
          app.commandLine.appendSwitch('force-webrtc-ip-handling-policy', 'default_public_interface_only');

          // 3. Loại bỏ toàn bộ dịch vụ ngầm và theo dõi của Google gốc (No Phone-Home)
          app.commandLine.appendSwitch('disable-background-networking');
          app.commandLine.appendSwitch('disable-breakpad');
          app.commandLine.appendSwitch('disable-component-update');
          app.commandLine.appendSwitch('disable-domain-reliability');
          app.commandLine.appendSwitch('disable-sync');
          app.commandLine.appendSwitch('disable-client-side-phishing-detection');
          app.commandLine.appendSwitch('disable-default-apps');
          app.commandLine.appendSwitch('no-default-browser-check');
          app.commandLine.appendSwitch('disable-speech-api');
          app.commandLine.appendSwitch('renderer-process-limit', '6');

          // =========================================================================
          // LƯU TOÀN BỘ DỮ LIỆU NGAY TRÊN Ổ VÀ THƯ MỤC CÀI ĐẶT (KHÔNG LƯU VÀO Ổ C)
          // =========================================================================
          const exeDir = path.dirname(process.execPath);
          const dataDir = path.join(exeDir, 'data');
          try {
            if (!fs.existsSync(dataDir)) {
              fs.mkdirSync(dataDir, { recursive: true });
            }
            app.setPath('userData', dataDir);
            app.setPath('appData', exeDir);
            app.setPath('sessionData', path.join(dataDir, 'Session'));
            app.setPath('crashDumps', path.join(dataDir, 'CrashDumps'));
            app.setPath('logs', path.join(dataDir, 'Logs'));
          } catch (e) {
            console.error('Error setting custom data directory:', e);
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1300,
              height: 860,
              title: 'Lumen Browser',
              autoHideMenuBar: true,
              backgroundColor: '#0d1613',
              show: false,
              webPreferences: {
                webviewTag: true,
                nodeIntegration: false,
                contextIsolation: true,
                spellcheck: false,
                backgroundThrottling: true
              }
            });

            // Tẩy sạch định danh Electron khỏi User-Agent, ngụy trang thành Chrome chuẩn 100%
            const rawUA = win.webContents.userAgent;
            const cleanUA = rawUA.replace(/Electron\/[0-9\.]+\s?/g, '');
            win.webContents.userAgent = cleanUA;

            win.once('ready-to-show', () => {
              win.show();
            });
            win.loadFile(path.join(__dirname, 'public', 'index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => {
              return { action: 'allow' };
            });
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@ | Out-File -FilePath app_runtime\main.js -Encoding utf8

      - name: 4. Biên dịch trên máy chủ GitHub
        working-directory: app_runtime
        run: |
          npm install
          npm run dist

      - name: 5. Xuất duy nhất 1 file cài đặt Setup (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Browser-Setup
          path: app_runtime/dist/*Setup*.exe
