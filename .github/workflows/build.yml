name: Build Windows Browser EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Kéo mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Tự động gom tài nguyên giao diện & Cấu hình App
        run: |
          mkdir app_runtime
          mkdir app_runtime\public

          # Tự động lấy toàn bộ giao diện bạn đã sửa
          $resPath = "chrome\browser\resources\new_tab_page"
          if (Test-Path $resPath) {
              Copy-Item -Path "$resPath\*" -Destination "app_runtime\public" -Recurse -Force
          }

          if (Test-Path "app_runtime\public\new_tab_page.html") {
              Copy-Item -Path "app_runtime\public\new_tab_page.html" -Destination "app_runtime\public\index.html" -Force
          }

          @"
          {
            "name": "lumen-browser",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": { "dist": "electron-builder --win --x64" },
            "build": {
              "appId": "com.lumen.browser",
              "productName": "Lumen Browser",
              "directories": { "output": "dist" },
              "win": { "target": ["nsis", "portable"] }
            },
            "devDependencies": {
              "electron": "^30.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          "@ | Out-File -FilePath app_runtime\package.json -Encoding utf8

          @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1300,
              height: 860,
              title: 'Lumen Browser',
              autoHideMenuBar: true
            });
            win.loadFile(path.join(__dirname, 'public', 'index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith('http:') || url.startsWith('https:')) {
                win.loadURL(url);
                return { action: 'deny' };
              }
              return { action: 'allow' };
            });
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@ | Out-File -FilePath app_runtime\main.js -Encoding utf8

      - name: 4. Biên dịch trên máy chủ GitHub
        working-directory: app_runtime
        run: |
          npm install
          npm run dist

      - name: 5. Xuất file cài đặt .EXE
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Browser-Windows-EXE
          path: app_runtime/dist/*.exe
