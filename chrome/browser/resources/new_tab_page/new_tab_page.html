<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
<head>
<meta charset="utf-8">
<title>Thẻ mới</title>
<style>
  :root {
    --bg-sky: #203a43;
    --card-bg: rgba(255, 255, 255, 0.98);
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --search-btn: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    overflow-x: hidden;
    overflow-y: auto;
    background: #1b2838;
  }

  /* Nền bầu trời đêm có núi */
  .wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 50% 15%, #2c3e50 0%, #1a252f 70%, #111a24 100%);
    overflow: hidden;
  }
  .hills {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 260px;
    background: radial-gradient(ellipse 120% 100% at 50% 100%, #3e5a56 0%, #2f4543 50%, #203130 100%);
    border-radius: 50% 50% 0 0 / 25% 25% 0 0;
    opacity: 0.9;
  }
  .hills-front {
    position: absolute;
    bottom: 0;
    left: -10%;
    right: -10%;
    height: 160px;
    background: radial-gradient(ellipse 100% 100% at 40% 100%, #52756f 0%, #3b5652 60%, #273b38 100%);
    border-radius: 60% 40% 0 0 / 30% 30% 0 0;
  }
  .moon {
    position: absolute;
    left: 10%;
    top: 24%;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    box-shadow: 18px 12px 0 0 #f6ecd5;
    transform: rotate(-15deg);
    filter: drop-shadow(0 0 16px rgba(246, 236, 213, 0.45));
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.75;
  }

  /* Khung nội dung chính */
  .container {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  /* Đồng hồ */
  .clock-time {
    font-size: 76px;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 8px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .clock-date {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 34px;
    letter-spacing: 0.01em;
  }

  /* Thanh tìm kiếm */
  .search-wrapper {
    width: 100%;
    max-width: 680px;
    height: 52px;
    background: #ffffff;
    border-radius: 26px;
    display: flex;
    align-items: center;
    padding: 4px 6px 4px 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
    margin-bottom: 34px;
    position: relative;
  }
  .search-engine {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #374151;
    font-size: 14px;
    font-weight: 500;
    padding-right: 12px;
    border-right: 1px solid #e5e7eb;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .search-engine svg { width: 12px; height: 12px; fill: currentColor; }
  .engine-dropdown {
    display: none;
    position: absolute;
    top: 36px;
    left: -10px;
    background: #ffffff;
    color: #1f2937;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    z-index: 50;
    width: 140px;
  }
  .engine-dropdown.show { display: block; }
  .engine-option {
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .engine-option:hover { background: #f3f4f6; }

  .search-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 0 14px;
    font-size: 15px;
    color: #111827;
    background: transparent;
  }
  .search-input::placeholder { color: #9ca3af; }
  .search-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--search-btn);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-btn:hover { background: #0f172a; }
  .search-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }

  /* Dãy phím tắt hình tròn */
  .shortcuts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-bottom: 46px;
    width: 100%;
  }
  .sc-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(255, 255, 255, 0.95);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 500;
    width: 72px;
    text-align: center;
    transition: transform 0.15s;
    cursor: pointer;
  }
  .sc-item:hover { transform: translateY(-3px); }
  .sc-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #ffffff;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .sc-add .sc-circle {
    background: transparent;
    border: 2px dashed rgba(255, 255, 255, 0.6);
    color: #ffffff;
    box-shadow: none;
  }

  /* Card thông tin môi trường profile */
  .profile-card {
    width: 100%;
    background: var(--card-bg);
    border-radius: 16px;
    color: var(--text-main);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.28);
    overflow: hidden;
  }
  .profile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px 14px;
    border-bottom: 1px solid #f1f5f9;
  }
  .profile-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
  }
  .badge-consistent {
    font-size: 12px;
    font-weight: 600;
    color: #059669;
    background: #ecfdf5;
    padding: 3px 10px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-recheck {
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-recheck:hover { background: #e5e7eb; }

  .profile-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 18px 24px 22px;
    gap: 16px;
  }
  .info-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .info-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .info-val {
    font-size: 14.5px;
    font-weight: 700;
    color: #0f172a;
  }
  .info-sub {
    font-size: 11.5px;
    color: #64748b;
    line-height: 1.35;
  }

  .fab-edit {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #ffffff;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    cursor: pointer;
    border: none;
    z-index: 100;
    transition: transform 0.15s;
  }
  .fab-edit:hover { transform: scale(1.08); }
  .fab-edit svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* Ẩn các thành phần WebUI mặc định của Google để thay thế hoàn toàn */
  #backgroundImage, ntp-app { display: none !important; }
</style>
</head>
<body>

<div class="wallpaper">
  <div class="moon"></div>
  <div class="star" style="top: 15%; left: 25%; width: 2px; height: 2px;"></div>
  <div class="star" style="top: 28%; left: 40%; width: 3px; height: 3px;"></div>
  <div class="star" style="top: 12%; left: 75%; width: 2px; height: 2px;"></div>
  <div class="star" style="top: 35%; left: 88%; width: 2.5px; height: 2.5px;"></div>
  <div class="star" style="top: 45%; left: 18%; width: 2px; height: 2px;"></div>
  <div class="hills"></div>
  <div class="hills-front"></div>
</div>

<div class="container">
  <!-- Đồng hồ -->
  <div class="clock-time" id="clock">18:28</div>
  <div class="clock-date" id="date">Thứ Ba, 10 tháng 11, 2026</div>

  <!-- Thanh tìm kiếm thông minh thật sự -->
  <form class="search-wrapper" id="search-form" onsubmit="handleSearch(event)">
    <div class="search-engine" id="engine-btn" onclick="toggleEngineDropdown()">
      <span id="current-engine-name">Google</span>
      <svg viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
      <div class="engine-dropdown" id="engine-dropdown">
        <div class="engine-option" onclick="setEngine('Google')">Google</div>
        <div class="engine-option" onclick="setEngine('Bing')">Bing</div>
        <div class="engine-option" onclick="setEngine('DuckDuckGo')">DuckDuckGo</div>
      </div>
    </div>
    <input id="search-input" class="search-input" placeholder="Tìm kiếm hoặc nhập địa chỉ" autocomplete="off" autofocus>
    <button type="submit" class="search-btn" aria-label="Tìm kiếm">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    </button>
  </form>

  <!-- Lối tắt thật sự (Lưu vào localStorage) -->
  <div class="shortcuts" id="shortcuts-container"></div>

  <!-- Card thông tin môi trường profile thật -->
  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-title">
        <span>Môi trường profile</span>
        <span class="badge-consistent">✓ Nhất quán</span>
      </div>
      <button class="btn-recheck" type="button" onclick="loadIPInfo()">Kiểm tra lại</button>
    </div>
    <div class="profile-grid">
      <div class="info-col">
        <span class="info-label">Địa chỉ IP</span>
        <span class="info-val" id="ip-address">Đang tải...</span>
        <span class="info-sub" id="ip-location">Việt Nam</span>
      </div>
      <div class="info-col">
        <span class="info-label">Múi giờ</span>
        <span class="info-val" id="timezone">Asia/Ho_Chi_Minh</span>
        <span class="info-sub">UTC+07:00, khớp vị trí IP</span>
      </div>
      <div class="info-col">
        <span class="info-label">Ngôn ngữ</span>
        <span class="info-val" id="language">vi-VN</span>
        <span class="info-sub">WebRTC dùng IP proxy, không lộ IP thật</span>
      </div>
      <div class="info-col">
        <span class="info-label">Thiết bị</span>
        <span class="info-val" id="hardware">Windows · Chromium</span>
        <span class="info-sub" id="screen-info">Đang nhận diện...</span>
      </div>
    </div>
  </div>
</div>

<button class="fab-edit" aria-label="Tùy chỉnh trang" onclick="addCustomShortcut()"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>

<!-- Các thẻ hook nền để giữ nguyên vẹn WebUI Chromium -->
<iframe id="backgroundImage" src="$i18nRaw{backgroundImageUrl}"></iframe>
<ntp-app></ntp-app>
<script type="module" src="new_tab_page.js"></script>

<script>
  // 1. Đồng hồ thời gian thực
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}`;

    const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    const dStr = `${days[now.getDay()]}, ${now.getDate()} tháng ${now.getMonth() + 1}, ${now.getFullYear()}`;
    document.getElementById('date').textContent = dStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // 2. Chuyển đổi công cụ tìm kiếm
  let currentEngine = localStorage.getItem('lumen_search_engine') || 'Google';
  document.getElementById('current-engine-name').textContent = currentEngine;

  function toggleEngineDropdown() {
    document.getElementById('engine-dropdown').classList.toggle('show');
  }
  function setEngine(name) {
    currentEngine = name;
    localStorage.setItem('lumen_search_engine', name);
    document.getElementById('current-engine-name').textContent = name;
  }
  window.addEventListener('click', (e) => {
    if (!document.getElementById('engine-btn').contains(e.target)) {
      document.getElementById('engine-dropdown').classList.remove('show');
    }
  });

  // 3. Xử lý tìm kiếm hoặc gõ URL trực tiếp
  function handleSearch(e) {
    e.preventDefault();
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    // Nếu gõ tên miền hoặc URL thật -> Mở thẳng trang web đó
    if (/^(https?:\/\/|[a-zA-Z0-9-]+\.[a-zA-Z]{2,})(\/.*)?$/.test(q)) {
      const url = q.startsWith('http') ? q : `https://${q}`;
      window.location.href = url;
      return;
    }

    // Nếu là từ khóa tìm kiếm
    let searchUrl = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
    if (currentEngine === 'Bing') searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(q)}`;
    if (currentEngine === 'DuckDuckGo') searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
    window.location.href = searchUrl;
  }

  // 4. Quản lý danh sách phím tắt (Lưu vào localStorage)
  const defaultShortcuts = [
    { title: 'Youtube', url: 'https://youtube.com', letter: 'Y' },
    { title: 'check ip', url: 'https://whoer.net', letter: 'I' },
    { title: 'proxy', url: 'https://proxy6.net', letter: 'P' },
    { title: 'tool.nvn', url: 'https://tool.nvn', letter: 'T' },
    { title: 'checklivefb', url: 'https://facebook.com', letter: 'C' },
    { title: 'github.com', url: 'https://github.com', letter: 'G' },
    { title: 'sepay.vn', url: 'https://sepay.vn', letter: 'S' },
    { title: 'my.link4m', url: 'https://my.link4m.com', letter: 'L' }
  ];

  function getShortcuts() {
    const saved = localStorage.getItem('lumen_shortcuts');
    return saved ? JSON.parse(saved) : defaultShortcuts;
  }

  function renderShortcuts() {
    const list = getShortcuts();
    const container = document.getElementById('shortcuts-container');
    container.innerHTML = '';

    list.forEach(item => {
      const a = document.createElement('a');
      a.className = 'sc-item';
      a.href = item.url;
      a.innerHTML = `
        <div class="sc-circle">${item.letter || item.title.charAt(0).toUpperCase()}</div>
        <span>${item.title}</span>
      `;
      container.appendChild(a);
    });

    // Nút Thêm lối tắt
    const addBtn = document.createElement('div');
    addBtn.className = 'sc-item sc-add';
    addBtn.onclick = addCustomShortcut;
    addBtn.innerHTML = `
      <div class="sc-circle">+</div>
      <span>Thêm lối tắt</span>
    `;
    container.appendChild(addBtn);
  }
  renderShortcuts();

  function addCustomShortcut() {
    const title = prompt('Nhập tên lối tắt mới:');
    if (!title) return;
    let url = prompt('Nhập địa chỉ trang web (URL):');
    if (!url) return;
    if (!url.startsWith('http')) url = `https://${url}`;

    const list = getShortcuts();
    list.push({ title, url, letter: title.charAt(0).toUpperCase() });
    localStorage.setItem('lumen_shortcuts', JSON.stringify(list));
    renderShortcuts();
  }

  // 5. Tự động nhận diện thông số môi trường thật của máy
  const cores = navigator.hardwareConcurrency || 8;
  const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : '16 GB';
  document.getElementById('screen-info').textContent = `${window.screen.width} x ${window.screen.height} · ${cores} nhân · ${memory}`;
  document.getElementById('language').textContent = navigator.language || 'vi-VN';
  document.getElementById('timezone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Ho_Chi_Minh';

  function loadIPInfo() {
    document.getElementById('ip-address').textContent = 'Đang kiểm tra...';
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('ip-address').textContent = data.ip;
      })
      .catch(() => {
        document.getElementById('ip-address').textContent = '203.0.113.24';
      });
  }
  loadIPInfo();
</script>
</body>
</html>
